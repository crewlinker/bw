version: "2"
linters:
  default: all
  disable:
    - canonicalheader
    - containedctx
    - dogsled
    - dupl
    - dupword
    - err113
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - gomodguard # deprecated in favor of gomodguard_v2; unused here (depguard covers it)
    - gomoddirectives
    - ireturn
    - maintidx
    - mnd
    - nlreturn
    - nonamedreturns
    - perfsprint
    - thelper
    - unparam
    - wrapcheck
    - wsl_v5
    - wsl
    - noinlineerr
    - embeddedstructfieldcheck
    - tagalign
    - tagliatelle
  settings:
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
        - pattern: ^fmt\.Print.*$
          msg: Do not commit print statements.
        - pattern: ^fmt\.Errorf.*$
          msg: use 'github.com/cockroachdb/errors' for errors
    cyclop:
      max-complexity: 30
    depguard:
      rules:
        force_cockroachdb_errors:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: errors
              desc: use 'github.com/cockroachdb/errors' instead
    revive:
      rules:
        - name: package-comments
          disabled: true
    staticcheck:
      checks:
        - all
        - "-ST1000"
        - "-QF1008"
    varnamelen:
      max-distance: 15
      ignore-names:
        - id
        - err
        - db
        - tx
        - w
        - r
        - ok
        - rw
        - ro
        - sy
        - op
        - lc
        - pk
        - sk
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - err113
          - errcheck
          - forcetypeassert
          - gochecknoglobals
          - gocyclo
          - gosec
          - lll
          - nilnil
          - nlreturn
          - perfsprint
          - revive
          - varnamelen
          - wrapcheck
          - gocognit
        path: _test\.go
      - path: (.+)\.go$
        text: ST1003
    paths:
      - node_modules
      - third_party$
      - builtin$
      - cdk\.out
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - node_modules
      - third_party$
      - builtin$
